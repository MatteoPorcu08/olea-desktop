name: OLEA — Aggiornamenti firmati Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - src-tauri/tauri.conf.json

permissions:
  contents: write

concurrency:
  group: olea-signed-release
  cancel-in-progress: false

jobs:
  verify:
    name: Test prima della release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test frontend
        run: npm run test:js
      - name: Test SQLite e Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    name: Pubblica installer e latest.json
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica firma e nuova versione
        id: preflight
        shell: pwsh
        env:
          OLEA_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OLEA_PUBLIC_KEY: ${{ vars.OLEA_UPDATER_PUBKEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $package = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1
          if (-not $cargo -or $version -ne $package -or $version -ne $cargo.Matches[0].Groups[1].Value) {
            throw 'Le versioni Tauri, npm e Cargo devono coincidere'
          }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Il tag Git ($env:GITHUB_REF_NAME) deve essere $tag"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ([string]::IsNullOrWhiteSpace($env:OLEA_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:OLEA_PUBLIC_KEY)) {
            Write-Warning 'Firma non configurata: esegui scripts/setup-update-signing.ps1 sul tuo PC (nessuna chiave caricata nel repository).'
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag gia pubblicata: nessuna sovrascrittura."
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.preflight.outputs.ready == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.preflight.outputs.ready == 'true'
        with:
          workspaces: src-tauri
      - name: Installa frontend
        if: steps.preflight.outputs.ready == 'true'
        run: npm install
      - name: Configura firma pubblica e endpoint GitHub
        if: steps.preflight.outputs.ready == 'true'
        run: python scripts/configure_updates.py
        env:
          OLEA_UPDATER_PUBKEY: ${{ vars.OLEA_UPDATER_PUBKEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Compila, firma e pubblica la release stabile
        if: steps.preflight.outputs.ready == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.preflight.outputs.tag }}
          releaseName: OLEA Desktop ${{ steps.preflight.outputs.version }}
          releaseBody: 'Release stabile con updater Tauri firmato e database SQLite locale. Le registrazioni rimangono sul PC.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: '--features updates --config src-tauri/tauri-updater.conf.json'
