name: OLEA — Release Windows firmata
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test frontend
        run: npm run test:js
      - name: Test SQLite e Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Installa dipendenze
        run: npm install
      - name: Configura endpoint e firma pubblica del repository
        run: python scripts/configure_updates.py
        env:
          OLEA_UPDATER_PUBKEY: ${{ vars.OLEA_UPDATER_PUBKEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Crea installer, firme e latest.json
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OLEA Desktop ${{ github.ref_name }}
          releaseBody: 'Nuova versione di OLEA. Le registrazioni SQLite restano separate dall’installazione.'
          releaseDraft: false
          prerelease: false
          args: '--features updates --config src-tauri/tauri-updater.conf.json'
