name: OLEA — Test e installer Windows
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Rust + frontend + installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test frontend
        run: npm run test:js
      - name: Test database SQLite
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verifica compilazione del modulo aggiornamenti Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --features updates
      - name: Compila installer Windows NSIS
        run: |
          npm install
          npx tauri build
      - name: Verifica che l'installer esista
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "Installer NSIS non trovato" }
          $files | ForEach-Object { Write-Host $_.FullName }
      - name: Conserva installer scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: OLEA-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Pubblica anteprima Windows su GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer mancante" }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "preview-$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "$($installer.FullName)" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "OLEA Desktop $version - Anteprima Windows" --notes "Installer di anteprima non firmato, senza updater. L’aggiornamento automatico si attiva con la prima release stabile firmata. Database SQLite invariato." --prerelease
          } else {
            gh release upload $tag "$($installer.FullName)" --repo $env:GITHUB_REPOSITORY --clobber
          }
