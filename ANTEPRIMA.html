function ico(k,opts=''){return `<svg ${opts} xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]||ICONS['info']}</svg>`;}
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0);}
function number(n,dec=1){return new Intl.NumberFormat('it-IT',{maximumFractionDigits:dec}).format(Number(n)||0);}
function round(n){return Math.round((Number(n)||0)*100)/100;}
function qty(n){return `${number(n,2)} L`;}
function day(s){if(!s)return '—';const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s);return m?`${m[3]}/${m[2]}/${m[1]}`:esc(s);}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function uuid(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;}
function sum(arr,fn){return round(arr.reduce((tot,item)=>tot+(Number(fn(item))||0),0));}
function emptyDB(){return {app:'OLEA_SITE',schemaVersion:2,updated:null,orchards:[],harvests:[],customers:[],sales:[],payments:[],expenses:[],adjustments:[]};}
function normalize(d){const db=emptyDB();if(!d||typeof d!=='object')return db;for(const k of ['orchards','harvests','customers','sales','payments','expenses','adjustments'])db[k]=Array.isArray(d[k])?d[k]:[];db.updated=d.updated||null;return db;}
function readDB(){if(DESKTOP)return emptyDB();try{const cur=localStorage.getItem(KEY);if(cur)return normalize(JSON.parse(cur));const old=localStorage.getItem(OLD_KEY);if(old){const imported=convertImport(JSON.parse(old));localStorage.setItem(KEY,JSON.stringify(imported));return imported;}}catch(e){console.warn('Archivio non disponibile',e);}return emptyDB();}
let db=readDB();
const ui={page:'dashboard',season:CURRENT_YEAR,search:{},openForm:null,storageOk:true};
function lastUpdated(){if(!db.updated)return 'Nessuna modifica registrata';const d=new Date(db.updated);return Number.isNaN(d.getTime())?'Archivio presente':`Salvato alle ${d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}`;}
function setSaveStatus(ok){ui.storageOk=ok;$('#save-state-title').textContent=saveBusy?'Salvataggio in corso…':ok?(DESKTOP?'Archivio SQLite salvato':'Salvato in questo browser'):'Salvataggio non disponibile';$('#save-state-time').textContent=ok?lastUpdated():'Crea un backup e verifica il disco';$('#save-dot').classList.toggle('bad',!ok);$('#storage-warning').hidden=ok;$('#storage-warning').textContent=ok?'':(DESKTOP?'Errore di scrittura nel database SQLite. I dati non sono stati salvati: non chiudere OLEA e riprova.':'Il browser non consente di salvare i dati: esporta subito un backup.');}
function snapshot(previous){if(DESKTOP)return;try{if(!previous)return;let history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');if(!Array.isArray(history))history=[];history.unshift({at:new Date().toISOString(),data:previous});history=history.slice(0,5);localStorage.setItem(HISTORY_KEY,JSON.stringify(history));}catch(e){console.warn('Cronologia backup non creata',e);}}
async function commit(previous){
 if(saveBusy){toast('Completa il salvataggio in corso prima di modificare ancora.','error');return false;}
 saveBusy=true;
 db.updated=new Date().toISOString();
 setSaveStatus(true);
 try{
   if(DESKTOP){
     if(!desktopReady)throw Error('Archivio non ancora caricato.');
     const payload=JSON.parse(JSON.stringify(db));
     desktopRevision=await desktopInvoke('save_archive',{payload,expectedRevision:desktopRevision});
     try{desktopHistory=await desktopInvoke('list_archive_history');}catch(error){console.warn('Cronologia non disponibile',error);}
   }else{
     localStorage.setItem(KEY,JSON.stringify(db));
     snapshot(previous);
   }
   saveBusy=false;setSaveStatus(true);render();return true;

   db=JSON.parse(previous);

function toast(message,level='success'){const node=document.createElement('div');node.className=`toast ${level==='error'?'error':''}`;node.innerHTML=ico(level==='error'?'info':'check-circle')+`<span>${esc(message)}</span>`;$('#toast-zone').append(node);setTimeout(()=>node.remove(),3800);}
function bySeason(arr){return arr.filter(x=>Number(x.season||String(x.date||'').slice(0,4)||CURRENT_YEAR)===ui.season);}
function dataSeason(x){return Number(x.season||String(x.date||'').slice(0,4)||CURRENT_YEAR);}
function seasonYears(){const s=new Set([CURRENT_YEAR,ui.season]);for(const k of ['harvests','sales','expenses','adjustments'])for(const x of db[k]){const year=dataSeason(x);if(year>=2000&&year<=2100)s.add(year);}return [...s].sort((a,b)=>b-a);}
function orchName(id){return db.orchards.find(x=>String(x.id)===String(id))?.name||'Non attribuito';}
function customerName(s){return db.customers.find(x=>String(x.id)===String(s.customerId))?.name||s.customerText||'Cliente occasionale';}
function saleTotal(s){return round((Number(s.liters)||0)*(Number(s.price)||0));}
function paid(s){return sum(db.payments.filter(p=>String(p.saleId)===String(s.id)),p=>p.amount);}
function due(s){return Math.max(0,round(saleTotal(s)-paid(s)));}
function expensesOfSeason(){const actual=bySeason(db.expenses).map(x=>({category:x.category||'Altro',amount:+x.amount||0,orchardId:x.orchardId||'',date:x.date,synthetic:false,id:x.id,description:x.description||''}));const mills=bySeason(db.harvests).filter(x=>+x.millingCost>0).map(x=>({category:'Frantoio',amount:+x.millingCost||0,orchardId:x.orchardId||'',date:x.date,synthetic:true,id:x.id,description:'Costo frantoio da raccolta'}));return [...actual,...mills];}
function metrics(){const sales=bySeason(db.sales),harvests=bySeason(db.harvests),payable=expensesOfSeason();const revenue=sum(sales,saleTotal),collected=sum(sales,paid),costs=sum(payable,x=>x.amount),produced=sum(harvests,x=>x.liters),sold=sum(sales,x=>x.liters),adj=sum(bySeason(db.adjustments),x=>x.liters);return {sales,harvests,payable,revenue,collected,due:Math.max(0,round(revenue-collected)),costs,net:round(revenue-costs),produced,sold,adj,stock:round(produced+adj-sold),oliveKg:sum(harvests,x=>x.olivesKg)};}
function stockYear(year){const by=(arr)=>arr.filter(x=>dataSeason(x)===Number(year));return round(sum(by(db.harvests),x=>x.liters)+sum(by(db.adjustments),x=>x.liters)-sum(by(db.sales),x=>x.liters));}

function pageHeading(kicker,title,subtitle,actions=''){return `<div class="pageheading"><div><div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1><p>${subtitle}</p></div><div class="page-actions">${actions}</div></div>`;}
function btn(label,action,kind='primary',extra=''){return `<button class="btn btn-${kind}" data-action="${action}" ${extra}>${ico(action==='backup'?'download':action==='import'?'upload':'plus')}<span>${esc(label)}</span></button>`;}
function panel(title,subtitle,content,action=''){return `<section class="panel"><div class="panel-header"><div><h3>${esc(title)}</h3>${subtitle?`<p>${subtitle}</p>`:''}</div>${action}</div>${content}</section>`;}
function emptyState(title,subtitle,iconName='leaf',action='',label=''){return `<div class="empty"><div class="empty-illustration">${ico(iconName)}</div><b>${esc(title)}</b><p>${esc(subtitle)}</p>${action?`<button class="btn btn-soft btn-sm" data-action="${action}">${ico('plus')}${esc(label||'Aggiungi')}</button>`:''}</div>`;}
function tbl(headers,rows,emptyHtml=''){return rows.length?`<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:(emptyHtml||emptyState('Ancora nessuna registrazione','I dati che aggiungi compariranno qui.'));}
function actionIcons(type,id,{payment=false}={}){const key=esc(id);return `<div class="actions-cell">${payment?`<button class="action-icon" data-action="add-payment" data-id="${key}" title="Registra incasso">${ico('wallet')}</button>`:''}<button class="action-icon" data-action="edit-${type}" data-id="${key}" title="Modifica">${ico('edit-3')}</button><button class="action-icon danger" data-action="delete-${type}" data-id="${key}" title="Elimina">${ico('trash-2')}</button></div>`;}
function statusTag(s){const d=due(s);return d<0.01?'<span class="tag">'+ico('check-circle')+' Pagata</span>':paid(s)>0?'<span class="tag amber"><span class="mini-dot"></span> Parziale</span>':'<span class="tag grey"><span class="mini-dot"></span> Da incassare</span>';}
function costGroups(){const g={};for(const e of expensesOfSeason())g[e.category]=round((g[e.category]||0)+(+e.amount||0));return Object.entries(g).sort((a,b)=>b[1]-a[1]);}
const COLORS=['#397d59','#a5b970','#dbb56d','#7da992','#b6cabb','#8ba3c0','#ce9e92','#a8b0a0'];
function donutHtml(){const groups=costGroups(),total=sum(groups,g=>g[1]);if(!groups.length)return emptyState('Nessuna spesa registrata','Le categorie di costo saranno rappresentate qui.','chart-pie');let angle=0;const parts=groups.map(([name,amount],i)=>{const from=angle;angle+=amount/total*100;return `${COLORS[i%COLORS.length]} ${from.toFixed(2)}% ${angle.toFixed(2)}%`});const legends=groups.slice(0,5).map(([name,amount],i)=>`<div class="legend-item"><span class="color" style="background:${COLORS[i%COLORS.length]}"></span><span title="${esc(name)}">${esc(name)}</span><strong>${money(amount)}</strong></div>`).join('');return `<div class="donut-layout"><div class="donut" style="background:conic-gradient(${parts.join(',')})"><div class="donut-core"><b>${money(total)}</b><span>Totale spese</span></div></div><div class="legend">${legends}${groups.length>5?`<div class="small-note">+ altre ${groups.length-5} categorie</div>`:''}</div></div>`;}
function monthlySvg(sales){const labels=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];const items=Array.from({length:12},(_,i)=>({key:`${ui.season}-${String(i+1).padStart(2,'0')}`,label:labels[i],value:0}));for(const s of sales){const key=String(s.date||'').slice(0,7);const k=items.find(x=>x.key===key);if(k)k.value=round(k.value+saleTotal(s));}
const later=sales.filter(x=>String(x.date||'').slice(0,4)!==String(ui.season));if(later.length){const g=new Map(items.filter(x=>x.value>0).map(x=>[x.key,x]));for(const s of later){const key=String(s.date||'').slice(0,7);if(!g.has(key)){const [year,month]=key.split('-');if(+month>=1&&+month<=12)g.set(key,{key,label:labels[+month-1]+' ’'+String(year).slice(2),value:0});}if(g.has(key))g.get(key).value=round(g.get(key).value+saleTotal(s));}const compact=[...g.values()].sort((a,b)=>a.key.localeCompare(b.key));if(compact.length){items.splice(0,items.length,...compact.slice(-12));}}
const w=700,h=260,l=53,r=15,t=20,b=34,plotH=h-t-b,plotW=w-l-r;const max=Math.max(1,...items.map(x=>x.value))*1.18;const X=i=>l+(items.length===1?plotW/2:i*plotW/(items.length-1));const Y=v=>t+plotH-(v/max)*plotH;const points=items.map((x,i)=>[X(i),Y(x.value)]);const line=points.map(([x,y],i)=>`${i===0?'M':'L'}${x.toFixed(2)},${y.toFixed(2)}`).join(' ');const area=`${line} L ${points.at(-1)[0]},${t+plotH} L ${points[0][0]},${t+plotH} Z`;const grids=[0,.25,.5,.75,1].map(i=>{const y=t+plotH*(1-i);return `<path d="M${l} ${y} H${w-r}" class="grid-line"/><text x="${l-10}" y="${y+3}" text-anchor="end" class="axis-text">${max*i>=1000?number(max*i/1000,1)+'k':number(max*i,0)}</text>`;}).join('');const xl=items.map((x,i)=>{const show=items.length<=8||i%2===0||i===items.length-1;return show?`<text x="${X(i)}" y="${h-7}" class="axis-text" text-anchor="middle">${esc(x.label)}</text>`:'';}).join('');const dots=points.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="4" class="dot"><title>${items[i].label}: ${money(items[i].value)}</title></circle>`).join('');return `<div class="chart-wrapper"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Andamento mensile del fatturato"><defs><linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7bb88e" stop-opacity=".30"/><stop offset="1" stop-color="#dcefe0" stop-opacity="0"/></linearGradient></defs>${grids}<path d="${area}" class="line-area"/><path d="${line}" class="line-path"/>${dots}${xl}</svg></div>${!sales.length?'<div class="small-note">Registra una vendita per iniziare a vedere l’andamento reale.</div>':''}`;}
function orchardBars(){const orch=db.orchards;if(!orch.length)return emptyState('Inizia dagli oliveti','Aggiungi gli appezzamenti per confrontare la produzione.','trees','add-orchard','Aggiungi oliveto');const values=orch.map(o=>({name:o.name,value:sum(bySeason(db.harvests).filter(h=>String(h.orchardId)===String(o.id)),h=>h.liters)})).sort((a,b)=>b.value-a.value);const max=Math.max(1,...values.map(v=>v.value));return `<div class="bar-list">${values.map(x=>`<div class="bar-item"><span class="bar-name" title="${esc(x.name)}">${esc(x.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,x.value/max*100)}%"></div></div><strong class="bar-amount">${qty(x.value)}</strong></div>`).join('')}</div>`;}
function recentTable(){const events=[...bySeason(db.sales).map(s=>({date:s.date,title:'Vendita',sub:customerName(s),amount:money(saleTotal(s)),kind:'sale'})),...expensesOfSeason().map(e=>({date:e.date,title:'Spesa',sub:e.category,amount:'− '+money(e.amount),kind:'expense'})),...bySeason(db.harvests).map(h=>({date:h.date,title:'Produzione',sub:orchName(h.orchardId),amount:qty(h.liters),kind:'harvest'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,6);return tbl(['Data','Movimento','Dettaglio','Importo'],events.map(e=>`<tr><td class="number">${day(e.date)}</td><td><span class="tag ${e.kind==='expense'?'red':e.kind==='harvest'?'grey':''}">${esc(e.title)}</span></td><td>${esc(e.sub)}</td><td class="number" style="font-weight:800">${esc(e.amount)}</td></tr>`),emptyState('Ancora nessun movimento','Aggiungi una raccolta, una vendita o una spesa per iniziare.','list-checks'));}
function renderDashboard(){const m=metrics();return `${pageHeading('IL TUO BUSINESS','Panoramica aziendale',`Numeri aggiornati in tempo reale · Campagna ${ui.season}`)}
<section class="hero"><div class="hero-content"><div class="hero-kicker">OLEA / CAMPAGNA ${ui.season}</div><h2>Il tuo olio, tutto sotto controllo.</h2><p>Produzione, vendite e guadagno in un unico posto. Ogni registrazione aggiorna automaticamente i risultati.</p></div><div class="hero-actions"><button class="btn" data-action="add-sale">${ico('plus')} Registra vendita</button><button class="btn" data-action="add-expense">${ico('receipt')} Nuova spesa</button></div></section>
<div class="metric-grid">${metricCard('Fatturato',money(m.revenue),'Valore delle vendite registrate','arrow-up-right')}${metricCard('Incassato',money(m.collected),'Pagamenti effettivamente ricevuti','wallet')}${metricCard('Da incassare',money(m.due),'Crediti ancora aperti','clock','credit')}${metricCard('Spese totali',money(m.costs),'Costi, incluso frantoio','receipt','spend')}${metricCard('Ricavo netto',money(m.net),'Fatturato meno spese','trend-up',`net ${m.net<0?'negative':''}`)}</div>
<div class="dashboard-grid">${panel('Andamento del fatturato','Vendite distribuite per mese · campagna selezionata',monthlySvg(m.sales),`<button class="corner-action" data-nav="reports">Apri report ${ico('arrow-right')}</button>`)}${panel('Composizione delle spese','Suddivisione per categoria',donutHtml(),`<button class="corner-action" data-nav="expenses">Dettaglio ${ico('arrow-right')}</button>`)}</div>
<div class="second-grid">${panel('Ultime registrazioni','Movimenti più recenti della campagna',recentTable(),`<button class="corner-action" data-nav="sales">Tutte le vendite ${ico('arrow-right')}</button>`)}${panel('Produzione per oliveto','Litri di olio prodotti per appezzamento',orchardBars())}</div>
<div class="info-box">${ico('info')}<span><strong>Come leggere i risultati:</strong> il fatturato è il valore delle vendite anche non ancora incassate; il guadagno gestionale è fatturato meno spese registrate. Non equivale automaticamente all'utile fiscale.</span></div>`;}
function tableToolbar(key,placeholder,action,label){return `<div class="toolbar"><div class="toolbar-left"><label class="search-field">${ico('search')}<input type="search" id="search-${key}" data-search="${key}" value="${esc(ui.search[key]||'')}" placeholder="${esc(placeholder)}" autocomplete="off" /></label></div>${btn(label,action)}</div>`;}
function filtered(arr,key,fn){const q=String(ui.search[key]||'').trim().toLowerCase();return !q?arr:arr.filter(x=>fn(x).toLowerCase().includes(q));}
function renderSales(){const m=metrics();const sales=filtered([...m.sales].sort((a,b)=>String(b.date).localeCompare(String(a.date))),'sales',s=>[customerName(s),s.package,orchName(s.orchardId),s.date].join(' '));return `${pageHeading('ATTIVITÀ COMMERCIALE','Vendite', 'Registra quantità, prezzo e cliente. Il fatturato e il magazzino si aggiornano subito.',btn('Nuova vendita','add-sale'))}
<div class="summary-strip"><div class="summary-tile"><small>Fatturato</small><strong>${money(m.revenue)}</strong><em>Tutte le vendite</em></div><div class="summary-tile"><small>Litri venduti</small><strong>${qty(m.sold)}</strong><em>Quantità complessiva</em></div><div class="summary-tile"><small>Già incassato</small><strong>${money(m.collected)}</strong><em>Pagamenti ricevuti</em></div><div class="summary-tile"><small>Da incassare</small><strong>${money(m.due)}</strong><em>Crediti residui</em></div></div>
${panel('Registro delle vendite',`${m.sales.length} vendite registrate`,`${tableToolbar('sales','Cerca cliente, formato o oliveto…','add-sale','Aggiungi')}${tbl(['Data','Cliente','Quantità','Prezzo/L','Totale','Incassato','Stato','Azioni'],sales.map(s=>`<tr><td class="number">${day(s.date)}<span class="table-sub">${esc(s.package||'Sfuso')}</span></td><td><span class="table-title">${esc(customerName(s))}</span><span class="table-sub">${esc(s.orchardId?orchName(s.orchardId):'Oliveto non attribuito')}</span></td><td class="number">${qty(s.liters)}</td><td class="number">${money(s.price)}</td><td class="number"><b>${money(saleTotal(s))}</b></td><td class="number">${money(paid(s))}</td><td>${statusTag(s)}</td><td>${actionIcons('sale',s.id,{payment:due(s)>.001})}</td></tr>`),emptyState('Nessuna vendita trovata','Crea la prima vendita oppure cambia la ricerca.','shopping-bag','add-sale','Nuova vendita'))}`)}
<div class="small-note" style="margin-top:12px">Le vendite sono attribuite alla campagna selezionata, anche se la data del pagamento è successiva. Gli incassi si registrano separatamente per non contare due volte il fatturato.</div>`;}
function renderPayments(){const m=metrics();const saleIds=new Set(m.sales.map(s=>String(s.id)));const items=db.payments.filter(p=>saleIds.has(String(p.saleId))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));return `${pageHeading('FLUSSI DI CASSA','Incassi','Registra ogni pagamento e controlla quanto ti devono ancora pagare.',btn('Registra incasso','add-payment','primary',m.due<.001?'disabled':''))}
<div class="summary-strip"><div class="summary-tile"><small>Incassato</small><strong>${money(m.collected)}</strong></div><div class="summary-tile"><small>Da incassare</small><strong>${money(m.due)}</strong></div><div class="summary-tile"><small>Pagamenti registrati</small><strong>${number(items.length,0)}</strong></div><div class="summary-tile"><small>Vendite da saldare</small><strong>${number(m.sales.filter(s=>due(s)>.001).length,0)}</strong></div></div>
${panel('Storico incassi','Pagamenti collegati a vendite specifiche',tbl(['Data incasso','Cliente','Vendita','Metodo','Importo','Azioni'],items.map(p=>{const s=db.sales.find(x=>String(x.id)===String(p.saleId));return `<tr><td class="number">${day(p.date)}</td><td><span class="table-title">${esc(s?customerName(s):'—')}</span></td><td class="number">${s?`${day(s.date)} · ${qty(s.liters)}`:'—'}</td><td>${esc(p.method||'—')}</td><td class="number"><b>${money(p.amount)}</b></td><td>${actionIcons('payment',p.id)}</td></tr>`;}),emptyState('Ancora nessun incasso','Puoi registrare un pagamento da una vendita.','wallet','add-payment','Registra incasso')))}
<div class="info-box" style="margin-top:16px">${ico('info')}<span>I pagamenti modificano gli importi <strong>incassato</strong> e <strong>da incassare</strong>, ma non il fatturato della vendita.</span></div>`;}
function renderCustomers(){const items=filtered([...db.customers].sort((a,b)=>a.name.localeCompare(b.name,'it')),'customers',x=>[x.name,x.phone,x.email,x.address].join(' '));return `${pageHeading('ANAGRAFICHE','Clienti','I contatti e lo storico degli acquisti, tutti in un posto.',btn('Nuovo cliente','add-customer'))}
${panel('Rubrica clienti',`${db.customers.length} clienti presenti`,`${tableToolbar('customers','Cerca nome, telefono o email…','add-customer','Nuovo cliente')}${tbl(['Cliente','Contatti','Vendite','Valore venduto','Azioni'],items.map(c=>{const sales=bySeason(db.sales).filter(s=>String(s.customerId)===String(c.id));return `<tr><td><span class="table-title">${esc(c.name)}</span><span class="table-sub">${esc(c.address||c.type||'Cliente')}</span></td><td>${esc(c.phone||'—')}<span class="table-sub">${esc(c.email||'')}</span></td><td class="number">${number(sales.length,0)}</td><td class="number"><b>${money(sum(sales,saleTotal))}</b></td><td>${actionIcons('customer',c.id)}</td></tr>`}),emptyState('Nessun cliente trovato','Aggiungi il primo cliente per tenere i contatti ordinati.','users','add-customer','Nuovo cliente'))}`)}`;}
function renderOrchards(){const items=filtered([...db.orchards].sort((a,b)=>a.name.localeCompare(b.name,'it')),'orchards',x=>[x.name,x.location,x.variety].join(' '));return `${pageHeading('PATRIMONIO AGRICOLO','I tuoi oliveti','Tieni distinti appezzamenti, piante, superfici e risultati.',btn('Nuovo oliveto','add-orchard'))}
${tableToolbar('orchards','Cerca oliveto, zona o cultivar…','add-orchard','Aggiungi oliveto')}
${items.length?`<div class="orchard-cards">${items.map(o=>{const harvest=bySeason(db.harvests).filter(h=>String(h.orchardId)===String(o.id));const cost=expensesOfSeason().filter(e=>String(e.orchardId)===String(o.id));return `<article class="orchard-card"><div class="orchard-head"><div class="orchard-avatar">${ico('trees')}</div><span class="chip">${esc(o.variety||'Varietà non indicata')}</span></div><h3>${esc(o.name)}</h3><p>${esc(o.location||'Località non indicata')} · ${number(o.hectares,2)} ha · ${number(o.trees,0)} piante</p><div class="orchard-stats"><div><small>Olio prodotto</small><strong>${qty(sum(harvest,h=>h.liters))}</strong></div><div><small>Costi attribuiti</small><strong>${money(sum(cost,e=>e.amount))}</strong></div></div><div class="orchard-actions"><button class="btn btn-soft btn-sm" data-action="edit-orchard" data-id="${esc(o.id)}">${ico('edit-3')} Modifica</button><button class="btn btn-light btn-sm" data-action="delete-orchard" data-id="${esc(o.id)}">${ico('trash-2')} Elimina</button></div></article>`}).join('')}</div>`:emptyState('Non ci sono oliveti da mostrare','Aggiungi il tuo primo appezzamento o modifica la ricerca.','trees','add-orchard','Aggiungi oliveto')}`;}
function renderHarvests(){const m=metrics(),rows=[...m.harvests].sort((a,b)=>String(b.date).localeCompare(String(a.date)));return `${pageHeading('RACCOLTA E FRANTOIO','Produzione','Traccia le olive raccolte e i litri effettivamente ottenuti per oliveto.',btn('Nuova raccolta','add-harvest'))}
<div class="summary-strip"><div class="summary-tile"><small>Olive conferite</small><strong>${number(m.oliveKg,1)} kg</strong></div><div class="summary-tile"><small>Olio prodotto</small><strong>${qty(m.produced)}</strong></div><div class="summary-tile"><small>Resa volumetrica</small><strong>${m.oliveKg?number(m.produced/m.oliveKg*100,1):'0'} L/100 kg</strong></div><div class="summary-tile"><small>Costi frantoio</small><strong>${money(sum(rows,x=>x.millingCost))}</strong></div></div>
${panel('Registro produzione',`${rows.length} raccolte nella campagna`,tbl(['Data','Oliveto','Olive','Olio','Resa','Costo frantoio','Azioni'],rows.map(h=>`<tr><td class="number">${day(h.date)}</td><td><span class="table-title">${esc(orchName(h.orchardId))}</span><span class="table-sub">${esc(h.mill||'Frantoio non indicato')}</span></td><td class="number">${number(h.olivesKg,1)} kg</td><td class="number"><b>${qty(h.liters)}</b></td><td class="number">${h.olivesKg?number(h.liters/h.olivesKg*100,1):'—'} L/100 kg</td><td class="number">${money(h.millingCost)}</td><td>${actionIcons('harvest',h.id)}</td></tr>`),emptyState('Nessuna produzione registrata','Inizia aggiungendo un oliveto e poi la prima raccolta.','sprout','add-harvest','Nuova raccolta')))}
<div class="small-note" style="margin-top:12px">La resa è indicata in litri di olio per 100 kg di olive, non come percentuale in peso. I costi del frantoio registrati qui sono già inclusi nella pagina Spese e nel bilancio.</div>`;}
function renderStock(){const m=metrics();const events=[...m.harvests.map(h=>({date:h.date,kind:'Produzione',label:orchName(h.orchardId),liters:+h.liters,id:h.id,type:'harvest'})),...m.sales.map(s=>({date:s.date,kind:'Vendita',label:customerName(s),liters:-s.liters,id:s.id,type:'sale'})),...bySeason(db.adjustments).map(a=>({date:a.date,kind:'Rettifica',label:a.reason,liters:+a.liters,id:a.id,type:'adjustment'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));return `${pageHeading('TRACCIAMENTO SCORTE','Magazzino','Produzione e vendite determinano automaticamente i litri disponibili.',btn('Rettifica giacenza','add-adjustment'))}
<div class="summary-strip"><div class="summary-tile"><small>Olio prodotto</small><strong>${qty(m.produced)}</strong></div><div class="summary-tile"><small>Olio venduto</small><strong>${qty(m.sold)}</strong></div><div class="summary-tile"><small>Rettifiche</small><strong>${qty(m.adj)}</strong></div><div class="summary-tile"><small>Olio disponibile</small><strong style="color:${m.stock<0?'#b54d4d':'#2d7d4f'}">${qty(m.stock)}</strong></div></div>
${m.stock<0?`<div class="info-box warn">${ico('info')}<span>Le registrazioni importate indicano una giacenza negativa. Controlla vendite, raccolte e rettifiche.</span></div>`:''}
${panel('Movimenti di magazzino','Aggiornati automaticamente a ogni modifica',tbl(['Data','Tipo','Riferimento','Movimento','Azioni'],events.map(e=>`<tr><td>${day(e.date)}</td><td><span class="tag ${e.liters<0?'red':'grey'}">${esc(e.kind)}</span></td><td>${esc(e.label)}</td><td class="number"><b style="color:${e.liters<0?'#b6564b':'#277c52'}">${e.liters>0?'+':''}${qty(e.liters)}</b></td><td>${actionIcons(e.type,e.id)}</td></tr>`),emptyState('Nessun movimento','Produci olio o registra una giacenza iniziale per iniziare.','package','add-adjustment','Rettifica giacenza')))}
<div class="info-box" style="margin-top:15px">${ico('info')}<span>Il sistema controlla che le nuove vendite non superino i litri disponibili nella campagna. Se hai già olio in deposito, registra una <strong>rettifica positiva</strong> come giacenza iniziale.</span></div>`;}
function renderExpenses(){const expenses=expensesOfSeason().sort((a,b)=>String(b.date).localeCompare(String(a.date)));const m=metrics(),groups=costGroups();const own=filtered(expenses,'expenses',x=>[x.category,x.description,orchName(x.orchardId),x.date].join(' '));return `${pageHeading('CONTROLLO DEI COSTI','Spese','Una pagina dedicata a tutti i costi, separata dalle vendite e dalla panoramica.',btn('Registra spesa','add-expense'))}

 const cdSize=centrals.reduce((n,x)=>n+x.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);u32(ev,0,0x06054b50);u16(ev,8,files.length);u16(ev,10,files.length);u32(ev,12,cdSize);u32(ev,16,offset);const output=new Uint8Array(offset+cdSize+22);let at=0;for(const part of [...chunks,...centrals,end]){output.set(part,at);at+=part.length;}return output;
}

async function checkForUpdates(silent=false){
 if(!DESKTOP){if(!silent)toast('Gli aggiornamenti automatici sono disponibili nell’app Windows.');return;}
 if(!desktopReady||saveBusy)return;
 try{
   const version=await desktopInvoke('check_updates');
   if(!version){if(!silent)toast('OLEA è aggiornato.');return;}
   if(!confirm('È disponibile OLEA '+version+'. Vuoi scaricare e installare questa versione firmata?'))return;
   await desktopInvoke('backup_database');
   toast('Download e installazione dell’aggiornamento in corso…');
   await desktopInvoke('install_updates');
 }catch(e){if(!silent)toast('Aggiornamenti non disponibili: '+String(e),'error');}
}
window.addEventListener('beforeunload',e=>{if(saveBusy){e.preventDefault();e.returnValue='Salvataggio in corso';}});
bootDesktop();
window.OLEA_TEST={getDB:()=>JSON.parse(JSON.stringify(db)),metrics:()=>metrics(),stockYear,loadDemo,convertImport,saveRecord,selectSeason:n=>{ui.season=n;render();},navigate};
})();

</script>
