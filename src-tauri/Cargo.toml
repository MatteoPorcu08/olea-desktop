[package]
name = "olea-desktop"
version = "3.0.3"
description = "OLEA — Gestione produzione e vendita olio di oliva"
authors = ["OLEA Project"]
edition = "2021"
build = "build.rs"

[lib]
name = "olea_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
updates = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-updater = { version = "2.10", optional = true }

[dev-dependencies]
tempfile = "3"
